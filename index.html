<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{background:#000;color:#0f0;font-family:monospace;padding:10px}
input,select{width:100%;margin:5px 0;padding:10px;background:#111;color:#0f0;border:1px solid #0f0}
button{width:48%;padding:15px;font-weight:bold;margin-top:5px}</style></head>
<body><h3>FLEET COMMAND</h3><label>Region</label>
<select id="r"><option value="https://us-api.segwaydiscovery.com">US Server</option>
<option value="https://eu-api.segwaydiscovery.com">EU Server</option></select>
<input id="id" placeholder="Client ID"><input id="sec" type="password" placeholder="Secret">
<input id="im" placeholder="Scooter IMEI">
<button onclick="run('unlock')" style="background:#0f0">UNLOCK</button>
<button onclick="run('lock')" style="background:red;color:#fff">LOCK</button>
<div id="log" style="font-size:10px;margin-top:10px">Ready...</div>
<script>const P = "https://cors-anywhere.herokuapp.com/";
function lg(m){document.getElementById('log').innerHTML += "<div>"+m+"</div>";}
async function getToken(){const u=document.getElementById('r').value;
const i=document.getElementById('id').value;const s=document.getElementById('sec').value;
const r=await fetch(P+u+"/oauth/token",{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
body:`client_id=${i}&client_secret=${s}&grant_type=client_credentials`});
const d=await r.json();return d.access_token;}
async function run(a){lg("Sending "+a+"...");try{const t=await getToken();
const u=document.getElementById('r').value;const im=document.getElementById('im').value;
const r=await fetch(P+u+"/api/v2/vehicle/control/"+a,{method:'POST',
headers:{'Authorization':'Bearer '+t,'Content-Type':'application/json'},
body:JSON.stringify({iotCode:im})});
const res=await r.json();lg("Result: "+res.msg);}
catch(e){lg("Error: Connect to cors-anywhere first");}}
</script></body></html>
