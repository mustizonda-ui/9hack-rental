<!DOCTYPE html>
<html>
<head>
    <title>9Hack Scooter Rental</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: black; 
            color: white; 
            padding: 20px; 
            margin: 0; 
        }
        .container { 
            max-width: 400px; 
            margin: 0 auto; 
        }
        .header { 
            text-align: center; 
            margin-bottom: 30px; 
        }
        .header h1 { 
            color: #007AFF; 
            font-size: 24px; 
            margin: 10px 0; 
        }
        .btn {
            background: #007AFF;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            border-radius: 10px;
            width: 100%;
            margin: 8px 0;
            cursor: pointer;
        }
        .btn:disabled {
            background: #333;
            color: #666;
        }
        .status {
            background: #111;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 4px solid #007AFF;
        }
        .info {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }
        .row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛴 9Hack Rental</h1>
            <p>Connect to Segway Scooters</p>
        </div>

        <button class="btn" onclick="scanScooters()" id="scanBtn">🔍 Scan Scooters</button>
        <button class="btn" onclick="startRental()" id="rentBtn" disabled>🔓 Start Rental</button>
        <button class="btn" onclick="endRental()" id="endBtn" disabled>🔒 End Rental</button>

        <div class="status" id="status">Ready to connect...</div>

        <div class="info" id="scooterInfo" style="display:none">
            <div class="row"><span>Battery:</span><span id="battery">-</span></div>
            <div class="row"><span>Speed:</span><span id="speed">-</span></div>
            <div class="row"><span>Rental Time:</span><span id="time">0:00</span></div>
        </div>
    </div>

    <script>
        let rentalTimer = null;
        let startTime = null;

        async function scanScooters() {
            const status = document.getElementById('status');
            status.textContent = "Scanning for Segway scooters...";
            
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'Segway' }, { namePrefix: 'Ninebot' }]
                });
                
                status.textContent = `Found: ${device.name}`;
                document.getElementById('rentBtn').disabled = false;
                document.getElementById('scooterInfo').style.display = 'block';
                document.getElementById('battery').textContent = '85%';
                
            } catch (err) {
                status.textContent = "Scan failed - try again";
            }
        }

        function startRental() {
            const status = document.getElementById('status');
            status.textContent = "Rental STARTED! Scooter unlocked.";
            
            document.getElementById('rentBtn').disabled = true;
            document.getElementById('endBtn').disabled = false;
            
            startTime = new Date();
            rentalTimer = setInterval(updateTime, 1000);
        }

        function endRental() {
            const status = document.getElementById('status');
            status.textContent = "Rental ENDED! Scooter locked.";
            
            document.getElementById('rentBtn').disabled = false;
            document.getElementById('endBtn').disabled = true;
            
            if (rentalTimer) clearInterval(rentalTimer);
        }

        function updateTime() {
            const now = new Date();
            const secs = Math.floor((now - startTime) / 1000);
            const mins = Math.floor(secs / 60);
            const seconds = secs % 60;
            document.getElementById('time').textContent = `${mins}:${seconds.toString().padStart(2, '0')}`;
        }
    </script>
</body>
</html>
