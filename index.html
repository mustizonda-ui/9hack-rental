
<!DOCTYPE html>
<html>
<head>
    <title>Scooter App</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        button { padding: 15px; margin: 10px; font-size: 16px; display: block; }
    </style>
</head>
<body>
    <h1>🛴 Scooter Rental</h1>
    <button id="connectBtn">Connect Bluetooth</button>
    <div id="status">Ready to connect</div>

    <script>
        document.getElementById('connectBtn').onclick = async function() {
            try {
                document.getElementById('status').textContent = "Scanning...";
                
                if (!navigator.bluetooth) {
                    document.getElementById('status').textContent = "Use Bluefy browser!";
                    return;
                }
                
                let device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true
                });
                
                document.getElementById('status').textContent = "Connected to: " + device.name;
                
            } catch(error) {
                document.getElementById('status').textContent = "Error: " + error.message;
            }
        };
    </script>
</body>
</html>
